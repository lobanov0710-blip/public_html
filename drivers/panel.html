<script>
const token = localStorage.getItem("driver_token");
const API = "https://restless-leaf-4a87.lobanov0710.workers.dev";

// =====================
// REDIRECT IF NO TOKEN
// =====================
if (!token) {
  location.href = "/drivers/login.html";
}

// =====================
// SAFE UI SET
// =====================
function setDriverName(name) {
  const el = document.getElementById("driverName");
  if (el) {
    el.textContent = name || "Driver";
  }
}

// =====================
// VERIFY DRIVER (JWT)
// =====================
async function loadDriver() {

  try {

    const res = await fetch(`${API}/driver/me`, {
      method: "GET",
      headers: {
        "Authorization": "Bearer " + token
      }
    });

    // ❌ токен невалидный или просрочен
    if (res.status === 401 || res.status === 403) {
      localStorage.removeItem("driver_token");
      location.href = "/drivers/login.html";
      return;
    }

    let data;

    try {
      data = await res.json();
    } catch (e) {
      console.error("Invalid JSON response");
      localStorage.removeItem("driver_token");
      location.href = "/drivers/login.html";
      return;
    }

    if (!res.ok || !data) {
      console.error("Driver error:", data);
      localStorage.removeItem("driver_token");
      location.href = "/drivers/login.html";
      return;
    }

    console.log("✅ driver:", data);

    setDriverName(data.name);

    // можно дальше использовать
    window.driver = data;

  } catch (e) {

    console.error("Network error:", e);

    // если сеть упала — не даём висеть в "полуработе"
    setTimeout(() => {
      location.href = "/drivers/login.html";
    }, 1500);
  }
}

loadDriver();
</script>
