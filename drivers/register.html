<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Регистрация водителя</title>

<link rel="stylesheet" href="/drivers/style.css">
</head>

<body>

<div class="auth-wrapper">

  <div class="auth-card">

    <h1>🚖 Регистрация</h1>
    <p>Заполните данные для подключения водителя</p>

    <div class="form-group">
      <input id="name" type="text" placeholder="Ваше имя" autocomplete="name">
    </div>

    <div class="form-group">
      <input id="phone" type="tel" placeholder="Телефон" autocomplete="tel">
    </div>

    <div class="form-group">
      <input id="password" type="password" placeholder="Пароль (не обязателен сейчас)">
    </div>

    <div class="form-group">
      <input id="car" type="text" placeholder="Автомобиль">
    </div>

    <button id="regBtn" type="button">
      Отправить заявку
    </button>

    <div id="status" class="status"></div>

    <p style="margin-top:20px;text-align:center;">
      Уже есть аккаунт?
      <a href="/drivers/login.html" style="color:#4ea1ff;text-decoration:none;">
        Войти
      </a>
    </p>

  </div>

</div>

<script src="/drivers/api.js"></script>
<script src="/drivers/register.js"></script>

</body>
</html>
