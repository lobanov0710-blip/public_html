<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Страница не найдена — Comfort Transfer</title>

<meta name="description" content="Страница не найдена. Вернитесь на сайт Comfort Transfer и закажите комфортный междугородний трансфер.">
<meta name="robots" content="noindex">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>

/* RESET */
* {
    margin:0;
    padding:0;
    box-sizing:border-box;
}

/* BODY */
body {
    font-family:'Inter',sans-serif;
    color:#eaeef2;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;

    background:url("images/background.webp") center/cover no-repeat fixed;
    position:relative;
    overflow:hidden;
}

/* затемнение */
body::before {
    content:"";
    position:fixed;
    inset:0;
    background:
        radial-gradient(circle at top, rgba(0,0,0,0.3), rgba(0,0,0,0.9)),
        linear-gradient(to bottom, rgba(11,15,20,0.4), rgba(11,15,20,0.95));
    z-index:1;
}

/* 🚗 МАШИНА НА ФОНЕ */
.car-bg {
    position:absolute;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:700px;
    max-width:90%;
    opacity:0.25;
    z-index:1;
    pointer-events:none;
    animation:floatCar 6s ease-in-out infinite;
}

/* контейнер */
.container {
    position:relative;
    z-index:2;
    background:rgba(0,0,0,0.55);
    padding:50px 30px;
    border-radius:16px;

    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);

    max-width:500px;
}

/* 404 */
h1 {
    font-size:80px;
    margin-bottom:10px;
    color:#f1d77a;
}

h2 {
    font-size:22px;
    margin-bottom:15px;
}

p {
    opacity:0.8;
    margin-bottom:25px;
}

/* BUTTON */
.btn {
    display:inline-block;
    padding:14px 30px;
    background:linear-gradient(135deg,#d4af37,#f1d77a);
    color:black;
    border-radius:30px;
    text-decoration:none;
    font-weight:600;
    transition:0.3s;
    margin:5px;
}

.btn:hover {
    transform:scale(1.05);
}

/* АНИМАЦИЯ */
@keyframes floatCar {
    0% { transform:translate(-50%, 0); }
    50% { transform:translate(-50%, -15px); }
    100% { transform:translate(-50%, 0); }
}

/* MOBILE */
@media (max-width:480px) {
    h1 {
        font-size:60px;
    }

    .container {
        padding:30px 20px;
    }

    .car-bg {
        width:90%;
        opacity:0.2;
    }
}

</style>
</head>

<body>

<!-- 🚗 ФОНОВОЕ АВТО -->
<img src="images/car.png" alt="Автомобиль" class="car-bg">

<div class="container">

    <h1>404</h1>

    <h2>Страница не найдена</h2>

    <p>
        Похоже, вы попали не туда.  
        Возможно, страница была удалена или ссылка устарела.  
        Через 5 секунд вы будете перенаправлены на главную.
    </p>

    <a href="/" class="btn">Вернуться на главную</a>
    <a href="/#tgForm" class="btn">Связаться с нами</a>

</div>

<script>
setTimeout(function () {
    window.location.href = "/";
}, 5000);
</script>

</body>
</html>
